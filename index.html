<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Progress Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-color: #6366f1;
            --neon-glow: rgba(99, 102, 241, 0.6);
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Dark Mode Styles */
        .dark {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        /* Neon Mode Styles */
        .neon-mode {
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        .neon-mode::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, #6366f1, transparent 30%);
            animation: rotate 20s linear infinite;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Enhanced Visibility for Neon Mode */
        .neon-mode h1, 
        .neon-mode h3, 
        .neon-mode #stats-text,
        .neon-mode #global-percentage {
            color: #ffffff !important;
            text-shadow: 0 0 12px rgba(99, 102, 241, 0.8);
        }

        .neon-mode p,
        .neon-mode .filter-btn:not(.active) {
            color: #cbd5e1 !important; /* Lighter slate for better contrast on dark neon */
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.8);
        }

        .neon-mode .glass-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .neon-mode .glass-card:hover {
            border-color: #818cf8;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            transform: translateY(-8px) scale(1.02);
        }

        .progress-ring {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .neon-mode .progress-ring {
            filter: drop-shadow(0 0 8px #6366f1);
        }

        .status-pill {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }

        .status-0 { background-color: #f1f5f9; color: #64748b; } 
        .status-1 { background-color: #fef9c3; color: #854d0e; } 
        .status-2 { background-color: #dcfce7; color: #166534; } 

        .dark .status-0 { background-color: #334155; color: #94a3b8; }
        .dark .status-1 { background-color: #422006; color: #fde047; }
        .dark .status-2 { background-color: #064e3b; color: #4ade80; }

        .neon-mode .status-2 { 
            background-color: rgba(74, 222, 128, 0.1); 
            border: 1px solid #4ade80; 
            color: #4ade80; 
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
            text-shadow: 0 0 5px #4ade80;
        }

        .neon-text {
            text-shadow: 0 0 15px var(--neon-glow);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 transition-all duration-500">

    <div class="relative z-10 max-w-6xl mx-auto px-4 py-8">
        <!-- Top Toolbar -->
        <div class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <span class="font-black text-2xl tracking-tighter block leading-none">DSA.PRO</span>
                    <span class="text-[10px] uppercase tracking-[0.2em] text-indigo-500 font-bold">Evolution</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2 bg-white dark:bg-slate-800 p-1.5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <button id="theme-toggle" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-all" title="Toggle Dark/Light">
                    <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.95 16.95l.707.707M7.05 7.05l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
                    <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9 9 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
                <div class="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1"></div>
                <button id="neon-toggle" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-2" title="Toggle Neon Mode">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                    Neon
                </button>
            </div>
        </div>

        <!-- Header -->
        <header class="mb-16 flex flex-col lg:flex-row lg:items-center justify-between gap-12">
            <div class="space-y-4">
                <h1 class="text-6xl font-black tracking-tight leading-none text-slate-900 dark:text-white transition-colors duration-500">
                    Master the <br/>
                    <span class="text-indigo-600 neon-text">Algorithm</span>
                </h1>
                <p class="text-slate-500 dark:text-slate-400 max-w-sm text-lg font-medium transition-colors duration-500">
                    Clean, interactive tracking for the modern software engineer.
                </p>
            </div>
            
            <div class="flex flex-wrap gap-4 items-center">
                <div class="bg-white dark:bg-slate-800 p-8 rounded-[2.5rem] shadow-2xl border border-slate-100 dark:border-slate-700 flex items-center gap-8 relative overflow-hidden transition-colors duration-500">
                    <div id="ring-glow" class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 blur-3xl rounded-full"></div>
                    <div class="relative w-24 h-24">
                        <svg class="w-full h-full">
                            <circle cx="48" cy="48" r="42" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-100 dark:text-slate-700" />
                            <circle id="global-progress-circle" cx="48" cy="48" r="42" stroke="#6366f1" stroke-width="8" fill="transparent" 
                                    stroke-dasharray="263.89" stroke-dashoffset="263.89" class="progress-ring" stroke-linecap="round" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <span id="global-percentage" class="text-2xl font-black italic text-slate-800 dark:text-white">0%</span>
                        </div>
                    </div>
                    <div class="z-10">
                        <p class="text-[10px] text-slate-400 uppercase font-black tracking-[0.3em] mb-2">Success Rate</p>
                        <p id="stats-text" class="text-3xl font-black italic text-slate-800 dark:text-white">0 / 12</p>
                        <div id="category-badges" class="flex gap-2 mt-3"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Controls -->
        <div class="flex flex-col md:flex-row gap-6 mb-12 items-center">
            <div class="relative w-full md:max-w-md">
                <input type="text" id="search-bar" placeholder="Filter by keyword..." 
                       class="block w-full px-6 py-4 border border-slate-200 dark:border-slate-700 rounded-3xl bg-white dark:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 transition-all shadow-xl text-sm font-medium dark:text-white">
                <kbd class="absolute right-4 top-4 px-2 py-1 text-[10px] font-bold text-slate-400 bg-slate-100 dark:bg-slate-700 rounded-md pointer-events-none">/</kbd>
            </div>
            <div class="flex gap-2 p-1.5 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-x-auto no-scrollbar w-full md:w-auto transition-colors duration-500">
                <button onclick="setFilter('all')" class="filter-btn active bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold uppercase transition-all">All</button>
                <button onclick="setFilter('0')" class="filter-btn px-5 py-2.5 rounded-xl text-xs font-bold uppercase text-slate-500 transition-all">To-Do</button>
                <button onclick="setFilter('1')" class="filter-btn px-5 py-2.5 rounded-xl text-xs font-bold uppercase text-slate-500 transition-all">Active</button>
                <button onclick="setFilter('2')" class="filter-btn px-5 py-2.5 rounded-xl text-xs font-bold uppercase text-slate-500 transition-all">Done</button>
            </div>
        </div>

        <!-- Topic Grid -->
        <div id="topics-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 mb-20">
            <!-- Topics injected here -->
        </div>

        <footer class="py-12 border-t border-slate-200 dark:border-slate-800 text-center space-y-4">
            <div class="flex justify-center gap-8 text-xs font-bold uppercase tracking-widest text-slate-400">
                <a href="#" class="hover:text-indigo-500 transition-colors">Documentation</a>
                <a href="#" class="hover:text-indigo-500 transition-colors">Resources</a>
                <a href="#" class="hover:text-indigo-500 transition-colors">Settings</a>
            </div>
            <p class="text-slate-400 text-[10px] font-medium tracking-normal">Propelled by Logic & Persistence • 2026</p>
        </footer>
    </div>

    <script>
        const topics = [
            { id: 1, name: 'Arrays', difficulty: 'Easy', description: 'Vectors, Two Pointers, Sliding Window', links: { lc: 'https://leetcode.com/tag/array/', gfg: 'https://www.geeksforgeeks.org/array-data-structure/' } },
            { id: 2, name: 'Strings', difficulty: 'Easy', description: 'KMP, Manacher\'s, Regex, Parsing', links: { lc: 'https://leetcode.com/tag/string/', gfg: 'https://www.geeksforgeeks.org/string-data-structure/' } },
            { id: 3, name: 'Linked Lists', difficulty: 'Medium', description: 'Slow-Fast Pointer, Reversal, Flattening', links: { lc: 'https://leetcode.com/tag/linked-list/', gfg: 'https://www.geeksforgeeks.org/data-structures/linked-list/' } },
            { id: 4, name: 'Stacks & Queues', difficulty: 'Medium', description: 'Monotonic Stack, LRU, Deque', links: { lc: 'https://leetcode.com/tag/stack/', gfg: 'https://www.geeksforgeeks.org/stack-data-structure/' } },
            { id: 5, name: 'Recursion', difficulty: 'Medium', description: 'Backtracking, Permutations, Subsets', links: { lc: 'https://leetcode.com/tag/recursion/', gfg: 'https://www.geeksforgeeks.org/recursion/' } },
            { id: 6, name: 'Trees', difficulty: 'Hard', description: 'LCA, Diameter, BST, Segment Trees', links: { lc: 'https://leetcode.com/tag/tree/', gfg: 'https://www.geeksforgeeks.org/binary-tree-data-structure/' } },
            { id: 7, name: 'Graphs', difficulty: 'Hard', description: 'Dijkstra, Tarjan\'s, Union Find', links: { lc: 'https://leetcode.com/tag/graph/', gfg: 'https://www.geeksforgeeks.org/graph-data-structure-and-algorithms/' } },
            { id: 8, name: 'DP', difficulty: 'Hard', description: 'LCS, Knapsack, Bitmask DP', links: { lc: 'https://leetcode.com/tag/dynamic-programming/', gfg: 'https://www.geeksforgeeks.org/dynamic-programming/' } },
            { id: 9, name: 'Heaps', difficulty: 'Medium', description: 'Priority Queues, K-way Merge', links: { lc: 'https://leetcode.com/tag/heap-priority-queue/', gfg: 'https://www.geeksforgeeks.org/heap-data-structure/' } },
            { id: 10, name: 'Tries', difficulty: 'Medium', description: 'Prefix Trees, XOR Maximization', links: { lc: 'https://leetcode.com/tag/trie/', gfg: 'https://www.geeksforgeeks.org/trie-data-structure-common-operations-with-implementation/' } },
            { id: 11, name: 'Bit Mani.', difficulty: 'Easy', description: 'XOR tricks, Power sets, Binary', links: { lc: 'https://leetcode.com/tag/bit-manipulation/', gfg: 'https://www.geeksforgeeks.org/bit-magic/' } },
            { id: 12, name: 'Greedy', difficulty: 'Medium', description: 'Intervals, Scheduling, Huffman', links: { lc: 'https://leetcode.com/tag/greedy/', gfg: 'https://www.geeksforgeeks.org/greedy-algorithms/' } }
        ];

        let userProgress = JSON.parse(localStorage.getItem('dsa_evolution_data')) || {};
        let currentFilter = 'all';
        let searchQuery = '';
        let isDarkMode = localStorage.getItem('dark_mode') === 'true';
        let isNeonMode = localStorage.getItem('neon_mode') === 'true';

        function init() {
            if (isDarkMode) document.body.classList.add('dark');
            if (isNeonMode) {
                document.body.classList.add('neon-mode');
                updateNeonButton();
            }
            updateThemeIcons();
            render();
            updateDashboard();
        }

        function updateThemeIcons() {
            document.getElementById('sun-icon').classList.toggle('hidden', !isDarkMode);
            document.getElementById('moon-icon').classList.toggle('hidden', isDarkMode);
        }

        function updateNeonButton() {
            const btn = document.getElementById('neon-toggle');
            if (isNeonMode) {
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-[0_0_15px_#6366f1]');
            } else {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-[0_0_15px_#6366f1]');
            }
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark');
            localStorage.setItem('dark_mode', isDarkMode);
            updateThemeIcons();
        });

        document.getElementById('neon-toggle').addEventListener('click', () => {
            isNeonMode = !isNeonMode;
            document.body.classList.toggle('neon-mode');
            localStorage.setItem('neon_mode', isNeonMode);
            updateNeonButton();
        });

        function cycleStatus(id) {
            const current = userProgress[id] || 0;
            const next = (current + 1) % 3;
            userProgress[id] = next;
            if (next === 2) {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.7 },
                    colors: ['#6366f1', '#4ade80', '#ffffff']
                });
            }
            save();
            render();
        }

        function save() {
            localStorage.setItem('dsa_evolution_data', JSON.stringify(userProgress));
            updateDashboard();
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-indigo-600', 'text-white');
                btn.classList.add('text-slate-500');
            });
            const activeBtn = event.currentTarget;
            activeBtn.classList.add('active', 'bg-indigo-600', 'text-white');
            activeBtn.classList.remove('text-slate-500');
            render();
        }

        document.getElementById('search-bar').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            render();
        });

        function updateDashboard() {
            const total = topics.length;
            const completed = Object.values(userProgress).filter(v => v === 2).length;
            const inProgress = Object.values(userProgress).filter(v => v === 1).length;
            const percentage = Math.round((completed / total) * 100);
            document.getElementById('global-percentage').innerText = `${percentage}%`;
            document.getElementById('stats-text').innerText = `${completed} / ${total}`;
            const circle = document.getElementById('global-progress-circle');
            const offset = 263.89 - (percentage / 100 * 263.89);
            circle.style.strokeDashoffset = offset;
            document.getElementById('category-badges').innerHTML = `
                <div class="flex items-center gap-1.5 bg-emerald-50 dark:bg-emerald-950/40 px-3 py-1 rounded-full border border-emerald-100 dark:border-emerald-800">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span class="text-[10px] font-black text-emerald-600 dark:text-emerald-400 uppercase">${completed} Done</span>
                </div>
                <div class="flex items-center gap-1.5 bg-amber-50 dark:bg-amber-950/40 px-3 py-1 rounded-full border border-amber-100 dark:border-amber-800">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                    <span class="text-[10px] font-black text-amber-600 dark:text-amber-400 uppercase">${inProgress} Learning</span>
                </div>
            `;
        }

        function render() {
            const grid = document.getElementById('topics-grid');
            const filtered = topics.filter(t => {
                const status = (userProgress[t.id] || 0).toString();
                const matchesFilter = currentFilter === 'all' || status === currentFilter;
                const matchesSearch = t.name.toLowerCase().includes(searchQuery) || t.description.toLowerCase().includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            grid.innerHTML = filtered.map(t => {
                const status = userProgress[t.id] || 0;
                const statusText = ['Not Started', 'In Progress', 'Completed'][status];
                const diffColor = t.difficulty === 'Easy' ? 'text-emerald-500' : t.difficulty === 'Medium' ? 'text-amber-500' : 'text-rose-500';

                return `
                    <div class="glass-card rounded-[2.5rem] p-8 flex flex-col justify-between group transition-all duration-500">
                        <div>
                            <div class="flex justify-between items-start mb-6">
                                <span onclick="cycleStatus(${t.id})" class="status-pill status-${status}">
                                    ${statusText}
                                </span>
                                <span class="text-[9px] font-black uppercase tracking-[0.2em] ${diffColor}">${t.difficulty}</span>
                            </div>
                            <h3 class="text-2xl font-black text-slate-800 dark:text-slate-100 mb-3 group-hover:text-indigo-500 transition-colors">${t.name}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium leading-relaxed min-h-[48px] line-clamp-2">${t.description}</p>
                        </div>
                        
                        <div class="mt-8 space-y-6">
                            <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full transition-all duration-700 ease-out" 
                                     style="width: ${status === 2 ? '100%' : status === 1 ? '45%' : '0%'}"></div>
                            </div>
                            
                            <div class="flex items-center justify-between pt-2">
                                <div class="flex gap-2">
                                    <a href="${t.links.lc}" target="_blank" title="LeetCode" class="p-2 bg-slate-50 dark:bg-slate-700/50 rounded-xl text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 transition-all">
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.483 0a1.374 1.374 0 0 0-.961.414l-4.377 4.51a.332.332 0 0 1-.466.01L5.61 2.993c-.54-.543-1.412-.543-1.95 0L.414 6.241a1.374 1.374 0 0 0 0 1.95l11.372 11.372c.427.427 1.05.518 1.584.272l10.222-4.667a1.374 1.374 0 0 0 .74-1.226V1.374A1.374 1.374 0 0 0 22.626 0H13.483zm.186 2.064h8.312v12.23l-9.15 4.177L2.409 7.218 5.253 4.374l2.585 2.585a1.436 1.436 0 0 0 2.016 0l5.051-5.204a.201.201 0 0 1 .14-.061h.142z"/></svg>
                                    </a>
                                    <a href="${t.links.gfg}" target="_blank" title="GeeksforGeeks" class="p-2 bg-slate-50 dark:bg-slate-700/50 rounded-xl text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 transition-all font-black text-[10px] flex items-center justify-center w-9 h-9">
                                        GFG
                                    </a>
                                </div>
                                <button onclick="cycleStatus(${t.id})" class="text-[10px] font-black text-indigo-500 uppercase tracking-widest hover:tracking-[0.2em] transition-all">Update State</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        init();
    </script>
</body>
</html>
